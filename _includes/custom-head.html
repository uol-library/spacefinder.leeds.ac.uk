    <style>
        /* the University of Leeds logo in the top bar (_includes/site-logo.html) */
        #top-bar nav > ul li.site-logo {
            flex: 0 0 40px;
            a { color: var(--topbar-color); }
            #uol-logo { display: block; width: 40px; height: 40px; }
            @media screen and (min-width: 1000px) {
                flex-basis: 286px;
                #uol-logo { width: 286px; }
            }
        }
        /* artworks in the list (assets/data/art/art.mjs): image full width */
        #listcontent .list-place.artwork {
            .place-details .place-image {
                width: 100%;
                float: none;
                margin: 0 0 1rem 0;
            }
            /* artworks in the list (assets/data/art/art.mjs): paragraph margins */
            .section-about p {
                padding: 0 0 1rem 0;
            }
            /* artworks in the list (assets/data/art/art.mjs): paragraph margins */
            .section-images img {
                width: 100%;
                float: none;
                margin: 0 0 1rem 0;
            }
        }
        /* the art trail routes on the map, and above the artworks in the list (art.mjs) */
        :root {
            --art-route-full: #b0127a;
            --art-route-short: #1062c4;
        }
        /* dotted lines: round caps on zero-length dashes make dots the width of the line */
        path.art-route-line { stroke-opacity: .9; stroke-linecap: round; }
        path.art-route-route { stroke: var(--art-route-full); stroke-dasharray: 0 16; }
        path.art-route-shortroute { stroke: var(--art-route-short); stroke-dasharray: 0 16; }
        #art-routes {
            padding: 1rem .5rem;
            border-bottom: 1px solid var(--separator-color);
            h3 { font-size: 1.4rem; font-weight: normal; padding-bottom: .3rem; }
            p { padding-bottom: .5rem; }
            ul { margin: 0; padding: 0; list-style: none; }
            li {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                gap: .25rem .5rem;
                padding: .5rem 0;
            }
            /* the route's name shows it on the map (and hides the other); the dots before it are the map key */
            .art-route-toggle {
                position: relative;
                padding: 0 0 0 1.5rem;
                border: 0;
                background: none;
                color: inherit;
                font: inherit;
                font-weight: bold;
                cursor: pointer;
                &:hover, &:focus-visible { text-decoration: underline; }
                &:before {
                    content: "";
                    position: absolute;
                    left: 0;
                    top: calc( 50% - 3px );
                    width: 1.1rem;
                    height: 6px;
                }
                &[aria-pressed="false"] {
                    font-weight: normal;
                    color: var(--light-text-color);
                    &:before { opacity: .3; }
                }
            }
            .art-route-route .art-route-toggle:before { background: var(--art-route-full); }
            .art-route-shortroute .art-route-toggle:before { background: var(--art-route-short); }
            .art-route-stats { color: var(--light-text-color); }
            
        }
        /* the selected building's outline (buildings.mjs) */
        :root { --building-outline: #b0127a; }
        path.building-outline {
            stroke: var(--building-outline);
            stroke-width: 3;
            fill: var(--building-outline);
            fill-opacity: .15;
        }
    </style>
